name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    name: Desktop · tests · examples · CLI · docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake g++ python3

      - name: Full verification
        run: ./scripts/test/run-all.sh

      - name: Version smoke
        run: |
          ./build/mcrpc version | tee /tmp/ver.txt
          grep -q 'library=1.1.0' /tmp/ver.txt
          grep -q 'sdk=1.1.0' /tmp/ver.txt
          grep -q 'protocol=1.1' /tmp/ver.txt
