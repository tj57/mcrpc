[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcrpc"
version = "1.0.0"
description = "Pure-Python mcRPC protocol library (compatible with the C++ reference)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "mcRPC contributors" }]
keywords = ["mcrpc", "mesh", "rpc", "homeassistant", "iot"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Communications",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/tj57/mcrpc"
Documentation = "https://github.com/tj57/mcrpc/tree/master/docs"
Repository = "https://github.com/tj57/mcrpc"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcrpc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
